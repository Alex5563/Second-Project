{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1>Sign up</h1>
    <form method="post">
      {% csrf_token %}
      {{ template_data.form.as_p }}
      <button type="submit" class="btn btn-primary">Create account</button>
    </form>
    <p class="mt-3">Already have an account? <a href="{% url 'accounts.login' %}">Log in</a></p>
  </div>
</div>
{% endblock content %}
