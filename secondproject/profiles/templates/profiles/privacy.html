{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1>Privacy settings</h1>
    <p class="text-muted">Choose what recruiters can see on your profile.</p>
    <form method="post">
      {% csrf_token %}
      {% for field in template_data.form %}
        <div class="form-check mb-2">
          {{ field }}
          <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        </div>
        {% if forloop.first %}<hr>{% endif %}
      {% endfor %}
      <button type="submit" class="btn btn-primary mt-3">Save settings</button>
      <a href="{% url 'profiles.index' %}" class="btn btn-outline-secondary mt-3">Cancel</a>
    </form>
  </div>
</div>
{% endblock content %}
