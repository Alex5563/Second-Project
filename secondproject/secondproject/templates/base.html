<!DOCTYPE html>
  {% load static %}
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ template_data.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
      body { font-family: 'Poppins', sans-serif; }
    </style>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home.index' %}">
          <i class="fa-solid fa-briefcase me-2"></i>Job Board
        </a>
        <!-- Login / signup / profile links-->
         <div class="ms-auto">
          {% if user.is_authenticated %}
            <span class="navbar-text me-3">Hi, {{ user.username }}</span>
            {% if user.role.role != 'recruiter' %}
            <a class="btn btn-outline-light btn-sm me-2" href="{% url 'jobs.index' %}">Jobs</a>
            <a class="btn btn-outline-light btn-sm me-2" href="{% url 'profiles.index' %}">My Profile</a>
            {% endif %}
            <a class="btn btn-outline-light btn-sm" href="{% url 'accounts.logout' %}">Log out</a>
          {% else %}
            <a class="btn btn-outline-light btn-sm me-2" href="{% url 'accounts.login' %}">Log in</a>
            <a class="btn btn-light btn-sm" href="{% url 'accounts.signup' %}">Sign up</a>
          {% endif %}
        </div>
      </div>
    </nav>
    <!-- Header -->

    <div class="container flex-grow-1 py-4">
      {% block content %}
      {% endblock content %}
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-light text-center py-3">
      <small>&copy; Job Board</small>
    </footer>
    <!-- Footer -->
  </body>
</html>
